<!doctype html>
<html lang="hu" data-pal="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Böjt — mi történik a testben, lépésről lépésre</title>
<meta name="description" content="Interaktív magyarázó a böjt élettanáról: glikogén, inzulin, glukagon, ketontestek, autofágia, elektrolitok. Mechanizmus, nem szabályok.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=latin-ext">
<style>
/* ---------- palettes (data-pal on <html>) ---------- */
:root,:root[data-pal="ember"]{
  --bg:#16100c;--bg2:#221710;--ink:#f6ede4;--mut:#cbb9a9;--acc:#f5a524;--acc2:#e0703a;
  --g1:rgba(245,165,36,.26);--g2:rgba(214,98,52,.24);--g3:rgba(150,40,40,.24);
  /* curve colours --glu … --gly are set from CURVE_STYLE in the script (identical in every palette) */
}
:root[data-pal="ketone"]{
  --bg:#12100f;--bg2:#1b1719;--ink:#f1eee9;--mut:#bdb6b0;--acc:#2dd4bf;--acc2:#818cf8;
  --g1:rgba(45,212,191,.22);--g2:rgba(99,102,241,.28);--g3:rgba(168,85,247,.2);
}
:root[data-pal="dawn"]{
  --bg:#1a1214;--bg2:#251a1d;--ink:#fbf1ec;--mut:#d3bfb9;--acc:#f9c77a;--acc2:#f49ab3;
  --g1:rgba(249,199,122,.24);--g2:rgba(244,114,182,.24);--g3:rgba(251,146,60,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
/* mandatory colourful layer so the glass blur is visible */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%,var(--g1),transparent 42%),
    radial-gradient(circle at 88% 30%,var(--g2),transparent 44%),
    radial-gradient(circle at 40% 92%,var(--g3),transparent 46%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%)}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4vw,2.1rem)}
h3{font-size:1.45rem}
h4{font-size:1.05rem;color:var(--acc);margin-top:1.1em}
p{margin:0 0 .9em}
a{color:var(--acc)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sec{padding:2.2rem 16px}
.skip{position:absolute;left:-999px;top:0;background:var(--acc);color:#000;padding:.5rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}

/* ---------- glass panel (mandatory) ---------- */
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;padding:1.6rem;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:0 8px 32px rgba(0,0,0,.35);
}
@media (max-width:600px){
  .glass{border-radius:16px;padding:1rem;
    backdrop-filter:blur(11px);
    -webkit-backdrop-filter:blur(11px)}
}

/* ---------- layout + left sidebar (pattern from Respiration's .menu) ---------- */
.layout{display:flex;gap:22px;max-width:1440px;margin:0 auto;padding:22px 16px 40px;align-items:flex-start}
main{flex:1;min-width:0}
main .wrap{max-width:none;padding-left:0;padding-right:0}
main .hero{padding-top:0}
.menu{width:252px;flex:0 0 252px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;padding:16px 12px;
  transition:width .28s ease,flex-basis .28s ease,padding .28s ease}
.menu-head{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px}
.menu-brand{flex:1;min-width:0}
.menu-title{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.28rem;margin:2px 6px 2px;letter-spacing:-.01em;white-space:nowrap}
.menu-sub{font-size:.74rem;color:var(--mut);margin:0 6px 4px;line-height:1.35}
.collapse-btn{flex:0 0 auto;width:36px;height:36px;border-radius:11px;cursor:pointer;background:rgba(255,255,255,.06);color:var(--ink);
  border:1px solid rgba(255,255,255,.14);font-size:1rem;display:grid;place-items:center;transition:transform .28s ease}
.collapse-btn:hover{background:rgba(255,255,255,.12)}
.langbar{display:flex;gap:4px;margin:0 4px 8px}
.langbar button{flex:1;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--mut);border-radius:9px;padding:6px 0;
  font:600 .72rem "IBM Plex Mono",monospace;cursor:pointer;transition:all .18s;min-height:32px}
.langbar button:hover{background:rgba(255,255,255,.09)}
.langbar button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.palbar{display:flex;gap:4px;margin:0 4px 4px}
.palbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:var(--mut);border-radius:9px;padding:6px 2px;font-size:.68rem;cursor:pointer;min-height:40px}
.palbar button[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:50%}
.menu-group{font-size:.67rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:15px 8px 5px;white-space:nowrap;overflow:hidden}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink);font-size:.88rem;font-family:inherit;
  text-align:left;cursor:pointer;padding:7px 8px;border-radius:11px;transition:background .18s;min-height:36px}
.menu-item:hover{background:rgba(255,255,255,.06)}
.menu-item.active{background:color-mix(in srgb,var(--mi) 20%,transparent);outline:1px solid color-mix(in srgb,var(--mi) 55%,transparent)}
.mi-ico{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 .7rem "IBM Plex Mono",monospace;
  color:var(--bg);background:var(--mi);box-shadow:0 0 9px color-mix(in srgb,var(--mi) 60%,transparent)}
.mi-ico.sq{border-radius:7px}
.mi-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* desktop collapsed rail */
@media (min-width:901px){
  .layout.collapsed .menu{width:64px;flex-basis:64px;padding:12px 8px}
  .layout.collapsed .menu-brand,.layout.collapsed .langbar,.layout.collapsed .palbar,.layout.collapsed .mi-label{display:none}
  .layout.collapsed .menu-head{justify-content:center}
  .layout.collapsed .collapse-btn{transform:rotate(180deg)}
  .layout.collapsed .menu-group{font-size:0;height:1px;margin:10px 6px;background:rgba(255,255,255,.14)}
  .layout.collapsed .menu-item{justify-content:center;padding:6px 0}
}
#menuBtn{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
@media (max-width:900px){
  .menu{position:fixed;top:0;left:0;bottom:0;z-index:40;width:272px;max-height:none;border-radius:0 18px 18px 0;transform:translateX(-106%);transition:transform .3s ease}
  .menu.open{transform:none}
  .collapse-btn{display:none}
  #menuBtn{display:grid;place-items:center;position:fixed;top:12px;left:12px;z-index:20;width:44px;height:44px;border-radius:13px;cursor:pointer;
    background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);font-size:1.15rem}
  .layout{display:block;padding-top:66px}
}
@media (prefers-reduced-motion:reduce){.menu,.collapse-btn,.backdrop{transition:none}}

/* ---------- hero ---------- */
.hero{padding-top:2.4rem}
.kicker{font:500 .8rem "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.hero-p{font-size:1.15rem;max-width:62ch}
.note{color:var(--mut);font-size:.92rem;border-left:3px solid var(--acc);padding-left:.8rem;max-width:70ch;margin:0}
.safety{padding-top:1rem;padding-bottom:0}
.safety .glass{padding:.9rem 1.2rem;border-color:color-mix(in srgb,var(--gcg) 45%,transparent)}
.safety p{margin:0;font-size:.9rem;color:var(--mut)}
.safety strong{color:var(--gcg)}

/* ---------- stations ---------- */
.stations{list-style:none;padding:0;margin:1.2rem 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.st{width:100%;height:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;align-items:start;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:.8rem .9rem;
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);transition:border-color .2s,transform .2s,background .2s}
.st:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.st-n{grid-row:span 2;font-size:1.3rem;color:var(--acc);line-height:1.2}
.st-name{font-family:"Fraunces",serif;font-weight:600;line-height:1.25}
.st-win{font-size:.78rem;color:var(--mut)}
.st.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.st.focus{border-color:var(--acc);background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 26%,transparent),rgba(255,255,255,.03));box-shadow:0 0 0 1px var(--acc),0 6px 24px color-mix(in srgb,var(--acc) 30%,transparent)}
.st[aria-expanded="true"]{outline:2px dashed var(--acc2);outline-offset:2px}
@media (max-width:600px){.stations{grid-template-columns:1fr 1fr}.st{backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);padding:.7rem}}
@media (max-width:380px){.stations{grid-template-columns:1fr}}

/* ---------- panel ---------- */
.panel{margin-top:.4rem;scroll-margin-top:90px}
.p-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .8rem}
.p-head h3{margin:0;flex:1 1 auto}
.p-num{color:var(--acc)}
.chip{font-size:.8rem;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.15rem .6rem;color:var(--mut)}
.x{background:none;border:1px solid rgba(255,255,255,.2);color:var(--ink);border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
.vary{font-size:.82rem;color:var(--mut);margin:.3rem 0 .8rem}
.lead{font-family:"Fraunces",serif;font-style:italic;font-size:1.2rem;color:var(--ink)}
.p-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.4rem;align-items:start}
@media (max-width:860px){.p-grid{grid-template-columns:minmax(0,1fr)}}
.diag{margin:0}
.diag figcaption{font-size:.8rem;color:var(--mut);margin-top:.3rem}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.diag svg{display:block;width:100%;min-width:380px;height:auto;background:rgba(0,0,0,.18);border-radius:14px}
.figs{margin:0;display:grid;gap:.5rem}
.figs div{display:grid;grid-template-columns:9.5rem 1fr;gap:.7rem;align-items:baseline;border-top:1px solid rgba(255,255,255,.09);padding-top:.45rem}
.figs dt{color:var(--acc);font-weight:500}
.figs dd{margin:0;font-size:.92rem;color:var(--mut)}
.ev{display:inline-block;font:600 .64rem "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);
  background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:999px;padding:.05rem .45rem;margin-right:.35rem;white-space:nowrap}
.ctx{font:500 .75rem "IBM Plex Mono",monospace;color:var(--mut);white-space:nowrap}
.rnote{margin:.2rem 0 1rem;padding:.7rem .9rem;border-radius:12px;font-size:.9rem;border:1px solid color-mix(in srgb,var(--gcg) 50%,transparent);background:color-mix(in srgb,var(--gcg) 10%,transparent)}
@media (max-width:420px){.figs div{grid-template-columns:1fr;gap:.1rem}}
.mean{margin-top:1.2rem;padding:1rem 1.2rem;border-radius:14px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.mean h4{margin-top:0}
.mean p{margin:0;font-size:1.05rem}
.p-nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:var(--ink);border-radius:999px;padding:.5rem 1rem;cursor:pointer;font:inherit;font-size:.9rem;min-height:40px}
.btn:hover{border-color:var(--acc)}

/* ---------- chart ---------- */
.chart-top{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline}
.expand-btn{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .9rem}
.expand-btn .ico{font-size:1.05rem;line-height:1}
.badge{font:500 .75rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--bg);background:var(--acc);border-radius:999px;padding:.2rem .7rem}
.slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;margin:1rem 0}
.slider-row label{font-size:.9rem;color:var(--mut)}
.slider-row output{min-width:5.5rem;text-align:right;font-size:1.1rem;color:var(--acc)}
@media (max-width:600px){.slider-row{grid-template-columns:1fr auto}.slider-row label{grid-column:1/-1}}
input[type=range]{width:100%;accent-color:var(--acc);height:36px;cursor:pointer}
.slider-row.zoom{margin:.4rem 0 .2rem}
.chart-box{width:100%}
.csvg{display:block;width:100%;height:auto;touch-action:pan-y}
.csvg .cv{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.csvg .cv.off,.csvg .dot.off,.csvg .anc.off{opacity:0}
.bar-legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:.6rem;font-size:.82rem;color:var(--mut)}
.bar-legend span{display:inline-flex;align-items:center;gap:.4rem}
.bar-legend i{display:inline-block;width:26px;height:10px;border-radius:5px;background:var(--acc)}
.bar-legend i.soft{opacity:.35}
.bar-legend i.dash{background:none;border:1px dashed var(--acc)}
.bar-legend i.anc{width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.csvg .grid{stroke:rgba(255,255,255,.08)}
.csvg text{fill:var(--mut);font:11px "IBM Plex Mono",monospace}
.csvg .gl{font:12px system-ui,sans-serif;fill:var(--mut);cursor:pointer}
.csvg .gl.on{fill:var(--ink)}
.csvg .gl.focus{fill:var(--acc);font-weight:700}
.csvg .wm{font:italic 13px "Fraunces",serif;fill:var(--mut)}
/* curve toggles: 2 rows × 3 (2 columns on narrow screens) */
.cv-toggles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.6rem 0 1.2rem}
@media (max-width:480px){.cv-toggles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cvt{display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:.65rem;row-gap:.1rem;align-items:center;text-align:left;
  background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:.45rem .6rem;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
.cvt:hover{border-color:rgba(255,255,255,.3)}
.cvt .cb{grid-row:span 2;width:18px;height:18px;border-radius:5px;border:2px solid var(--mut);display:grid;place-items:center;font-size:.75rem;line-height:1;color:var(--bg)}
.cvt[aria-pressed="true"] .cb{background:var(--ink);border-color:var(--ink)}
.cvt .smp{grid-row:span 2;width:30px;height:10px;overflow:visible}
.cvt .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvt .lv{grid-column:3;font:500 .72rem "IBM Plex Mono",monospace;color:var(--mut)}
/* narrow: name gets the full first row (may wrap), line sample + level go to the second row */
@media (max-width:480px){
  .cvt{grid-template-columns:auto auto minmax(0,1fr);row-gap:.15rem}
  .cvt .cb{grid-row:1}
  .cvt .nm{grid-column:2/-1;grid-row:1;white-space:normal;line-height:1.25}
  .cvt .smp{grid-column:2;grid-row:2}
  .cvt .lv{grid-row:2}
}
.cvt[aria-pressed="false"]{opacity:.5}
.cvt[aria-pressed="false"] .nm{text-decoration:line-through}
/* expanded chart: real fullscreen, or the fallback overlay when the Fullscreen API is missing/refused */
#chartPanel.is-full{position:fixed;inset:0;z-index:60;margin:0;border-radius:0;overflow:auto;max-height:100vh;
  background:radial-gradient(circle at 12% 18%,var(--g1),transparent 42%),radial-gradient(circle at 88% 30%,var(--g2),transparent 44%),linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%)}
body.chart-expanded{overflow:hidden}
body.chart-expanded .menu,body.chart-expanded #menuBtn,body.chart-expanded .backdrop{display:none}
.focus-box{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;font-size:.92rem}
.focus-box .lbl{color:var(--mut)}
.focus-box .btn{padding:.3rem .8rem;min-height:34px}
.focus-box .btn.main{border-color:var(--acc);color:var(--acc)}

/* ---------- video library (pattern from Respiration's VIDEOS / buildVideos) ---------- */
.vid-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:1rem}
.vid-card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);box-shadow:0 18px 50px -22px rgba(0,0,0,.75)}
.vid-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:radial-gradient(circle at 30% 30%,var(--g1),transparent 65%),rgba(0,0,0,.35)}
.vid-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font:500 .8rem "IBM Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase}
.vid-title{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.02rem;margin:11px 4px 2px;display:flex;flex-direction:column;gap:2px;min-height:2.8em}
.vid-line{display:block;line-height:1.32}
.vid-line.placeholder{color:var(--mut);letter-spacing:.14em}
@media (max-width:600px){.vid-grid{grid-template-columns:1fr}.vid-card{padding:10px;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}}
.figs dd a{color:var(--acc);white-space:nowrap}

/* ---------- sources ---------- */
.src{padding-left:1.3rem;margin:0}
.src li{margin-bottom:.5rem;font-size:.9rem;color:var(--mut)}
.src li a{word-break:break-word}
.disc{margin-top:1rem;border-color:color-mix(in srgb,var(--gcg) 45%,transparent)}
.disc h3{color:var(--gcg)}
footer{padding:1.5rem 16px 2.5rem;text-align:center;color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="ui.skip">Ugrás a tartalomhoz</a>

<button type="button" id="menuBtn" aria-controls="menu" aria-expanded="false" data-ta="ui.menuOpen">☰</button>
<div class="backdrop" id="backdrop"></div>

<div class="layout" id="layout">
<aside class="menu glass" id="menu" data-ta="ui.navLabel">
  <div class="menu-head">
    <div class="menu-brand">
      <p class="menu-title"><span aria-hidden="true">⏳</span> <span data-t="ui.brand">Böjt</span></p>
      <p class="menu-sub" data-t="ui.menuSub"></p>
    </div>
    <button type="button" class="collapse-btn" id="collapseBtn" aria-controls="menu" aria-expanded="true">«</button>
  </div>
  <div class="langbar" role="group" id="langs" data-ta="ui.langLabel"></div>
  <div class="palbar" role="group" id="pals" data-ta="pal.label"></div>
  <nav id="nav"></nav>
</aside>

<main id="main">
  <section class="hero wrap" id="top">
    <div class="glass">

    switch:{name:"Az anyagcsere-váltás",sh:"Anyagcsere-váltás",lead:"A májglikogén fogy; a zsír lesz a fő üzemanyag.",

      mean:"A váltás nem óra, hanem üzemanyagmérő. Ami gyorsabban üríti a májglikogént (például a fizikai aktivitás), az előbbre hozza; ami feltölti, az kitolja. Az időzítés a mechanizmust követi."},
    gng:{name:"Glukoneogenezis",sh:"Glukoneogenezis",lead:"A máj nem szénhidrát eredetű alkotórészekből épít új glükózt.",

        "A máj három fő forrásból készít új glükózt: glicerinből (a zsírbontásból felszabaduló vázból), laktátból (a vörösvérsejtekből és az izomból — Cori-kör) és aminosavakból, főként az izomfehérjéből származó alaninból és glutaminból.",

    keto:{name:"Ketogenezis",sh:"Ketogenezis",lead:"A máj a zsírsavakat vízben oldódó üzemanyaggá alakítja.",

        "A ketontestek oldódnak a vérben, könnyen bejutnak a szövetekbe, és a mitokondriumokban a zsírsavakhoz hasonlóan elégethetők. Maga a máj nem tudja felhasználni őket — hiányzik hozzá a szükséges enzim —, ezért exportálja őket.",
        "Az inzulin fékezi ezt a folyamatot. Normálisan működő hasnyálmirigy esetén továbbra is marad némi inzulin, ami a ketonszintet korlátozott tartományban tartja. Diabéteszes ketoacidózisban az inzulin kritikusan hiányzik, a fék nem működik, és a ketonok a glükózzal együtt veszélyes szintre emelkednek — ez egy másik állapot."],
      mean:"A ketontestekkel a máj „becsomagolja” a zsírt azoknak a szöveteknek, amelyek közvetlenül nem tudják jól hasznosítani. Szintjük napok alatt fokozatosan emelkedik, ezért hatásuk az idővel nő, nem egy meghatározott órában jelenik meg."},
    brain:{name:"Az agy ketonokon",sh:"Az agy ketonokon",lead:"Az agy fokozatosan áthelyezi üzemanyagának egy részét a glükózról a ketonokra.",

        "A ketontestek viszont átjutnak rajta, monokarboxilát-transzportereken (MCT) keresztül. Hogy az agy mennyit használ fel belőlük, az nagyrészt a vér ketonszintjétől függ, így a ketonhasznosítás a böjt napjai alatt a ketonszinttel együtt nő; a transzporterek mennyisége is növekedhet.",
        "Owen és Cahill klasszikus vizsgálatában 5–6 hetes böjt után a béta-hidroxibutirát és az acetoacetát váltotta fel a glükózt az agy fő üzemanyagaként. Az agy béta-hidroxibutirát-szintje már 2–3 nap böjt után is mérhetően emelkedik (lásd a kulcsszámokat)."],

    protein:{name:"Fehérjekímélés",sh:"Fehérjekímélés",lead:"Az emelkedő ketonszint csökkenti a fehérjebontás szükségességét.",
      mech:["A böjt elején az agy glükózigényének nagy része glukoneogenezisből származik, ennek jelentős része pedig aminosavakból — a test fehérjéiből, mivel a szervezetnek nincs külön fehérjeraktára.",
        "Ahogy az agy egyre több energiáját fedezi ketonokból, kevesebb glükózra van szüksége. Kisebb glükózigény kevesebb aminosavból történő glukoneogenezist jelent, így a fehérjebontás lassul.",
        "Cahill munkacsoportjának vizsgálatai szerint hosszan tartó böjtben csökken a vér alaninszintje — ez a fő glükózképző aminosav —, a máj kevesebbet vesz fel belőle, és a fehérjebontás mérséklődik; egy többhetes böjt végére az energiának már csak kis része származik aminosavakból (lásd a kulcsszámokat). A pontos értékek egyénenként és vizsgálatonként eltérnek."],

    autophagy:{name:"Autofágia",sh:"Autofágia",lead:"A sejtek újrahasznosítják elhasználódott alkotórészeiket — az időzítés emberben bizonytalan.",
      mech:["Az autofágia („önemésztés”) a sejtekben folyamatosan zajló lebontó-újrahasznosító mechanizmus: a sejt a sérült fehérjéket és sejtszervecskéket membránba zárja (autofagoszóma), ezt lizoszómával egyesíti, és a tartalmat újrahasznosítható építőkövekre bontja.",
        "Tápanyag-érzékelők szabályozzák. Az mTOR (amelyet a tápanyagok, az aminosavak és az inzulin aktiválnak) gátolja az autofágiát; az AMPK (amely alacsony sejtenergia esetén aktiválódik) serkenti. A böjt csökkenti az mTOR és növeli az AMPK aktivitását, így a mérleg az autofágia felé billen.",
        "Fontos megkötés: arra vonatkozóan, hogy a böjt mikor és mennyire fokozza az autofágiát, az adatok többsége állat- és sejtkísérletekből származik. Jelenleg nincs bevált módszer az egész test autofágiájának közvetlen mérésére élő emberben, így az emberi időzítés bizonytalan. Az az állítás, hogy az autofágia egy pontos órában „indul be”, nem megalapozott."],
      mean:"Az autofágia folyamatosan zajlik, olyan szinten, amelyet az mTOR- és AMPK-jelek állítanak be. A böjt nem ki-be kapcsol, hanem egy szabályozógombot teker el — és embernél még nyitott kérdés, hogy mennyire és milyen gyorsan."},
    hormones:{name:"Hormonok és elektrolitok",sh:"Hormonok, elektrolitok",lead:"A növekedési hormon és a noradrenalin emelkedik; a só és a víz eltolódik.",
      mech:["A böjt alatt fokozódik a növekedési hormon elválasztása. Ez elősegíti a lipolízist, és segít megőrizni a fehérjét. Az első napokban a noradrenalin (szimpatikus aktivitás) is emelkedik, ami támogatja a zsírmobilizációt és az éberséget; rövid távú vizsgálatokban a nyugalmi energiafelhasználás az első napokban megmaradt vagy kissé nőtt.",
        "A glikogén vízzel együtt raktározódik. Ahogy a glikogén elfogy, ez a víz felszabadul és kiürül.",
        "A csökkenő inzulin a vesére is hat: az inzulin rendes körülmények között elősegíti a nátrium visszatartását, így alacsony inzulin mellett több nátrium — és vele víz — ürül (böjt okozta natriuresis, azaz fokozott nátriumürítés). A ketontestek kationokkal, például nátriummal és káliummal együtt ürülnek a vizelettel. A kálium, a magnézium és a foszfát vérszintje normálisnak tűnhet, miközben a test teljes készlete csökken."],
      mean:"Az első napok gyors súlycsökkenése nagyrészt víz és glikogén, nem zsír — a glikogén–víz kapcsolat és a nátriumvesztés közvetlen következménye. Ez azt is megmagyarázza, miért számít a só- és folyadékegyensúly böjt alatt többet, mint gondolnánk."},
    refeed:{name:"A böjt megtörése / újratáplálás",sh:"Újratáplálás",lead:"Az inzulin visszatér — és ásványi anyagokat húz a sejtekbe.",
      mech:["Amikor újra táplálék, különösen szénhidrát érkezik, az inzulin gyorsan emelkedik. A test visszavált raktározó üzemmódba: a ketogenezis és a lipolízis gátlódik, a sejtek glükózt vesznek fel, a glikogén újraépül.",
        "A glükóz felhasználásához, valamint a glikogén- és fehérjeépítéshez foszfát (az ATP-hez és a foszforilált köztitermékekhez), kálium és magnézium kell, és az inzulin ezeket a sejtekbe juttatja. A tiamin (B1-vitamin) gyorsabban fogy, ahogy a szénhidrát-anyagcsere újraindul. Az inzulin a nátrium- és vízvisszatartást is elősegíti.",
        "Hosszan tartó alacsony vagy nulla bevitel után ezeknek az ásványi anyagoknak a teljes testkészlete kimerülhet, még ha a vérszintek normálisnak tűntek is. Az ásványi anyagok hirtelen sejtekbe áramlása ekkor meredeken csökkentheti a vér foszfát-, kálium- és magnéziumszintjét, folyadék-visszatartással együtt — ez az újratáplálási (refeeding) szindróma, amely a szívet, az izmokat és az idegrendszert érintheti, és életveszélyes lehet."],
      mean:"A kockázat nem magában az ételben rejlik, hanem abban, milyen gyorsan vált vissza a kimerült szervezet raktározó üzemmódba. Minél hosszabb és súlyosabb volt a megelőző táplálékhiány, annál nagyobb lehet ez a váltás — ezért orvosi kérdés a hosszan tartó böjt utáni újratáplálás."}
  }

  st:{
    fed:{name:"Starea de hrănire",sh:"Starea de hrănire",lead:"Glucoza intră în sânge, insulina crește, corpul stochează.",
      mech:["Carbohidrații sunt descompuși în intestin până la glucoză, care este absorbită în sânge. Creșterea glicemiei determină celulele beta din pancreas să elibereze insulină.",
        "Insulina este semnalul de stocare. Permite celulelor musculare și adipoase să preia glucoza, stimulează ficatul și mușchii să formeze glicogen, favorizează depozitarea grăsimilor în țesutul adipos — și în același timp inhibă eliberarea grăsimilor (lipoliza) și producția de corpi cetonici.",
        "Capacitatea de stocare a glicogenului este limitată. Odată ce depozitele sunt pline, surplusul de energie este stocat în principal sub formă de grăsime — rezerva mare și bogată în energie a corpului."],
      mean:"Cât timp insulina este ridicată, corpul este în modul de stocare: insulina crescută inhibă lipoliza și favorizează stocarea, astfel că eliberarea netă a acizilor grași stocați este redusă. Situația se inversează pe măsură ce insulina scade — primele ore după masă sunt dedicate stocării, nu arderii rezervelor."},
    postabs:{name:"Starea postabsorbtivă",sh:"Postabsorbtivă",lead:"Intestinul s-a golit; ficatul preia aprovizionarea cu glucoză.",
      mech:["Când absorbția se încheie, glicemia revine spre valoarea de bază. Insulina scade, iar celulele alfa din pancreas eliberează mai mult glucagon.",
        "Glucagonul acționează în principal asupra ficatului: descompune glicogenul hepatic (glicogenoliză) și eliberează glucoză în sânge. Acest lucru îl poate face în principal ficatul (contribuie și rinichiul), deoarece aceste organe au enzima glucozo-6-fosfatază, care lipsește din mușchi. Glicogenul muscular rămâne în mușchi și este folosit acolo.",
        "În paralel, ficatul începe să producă glucoză nouă (gluconeogeneză), iar, cu insulina mai scăzută, celulele adipoase încep să elibereze acizi grași."],
      mean:"Glicemia rămâne stabilă fără mâncare pentru că ficatul își eliberează rezerva. Această rezervă este mică, de aceea faza nu poate dura la nesfârșit — iar următoarea schimbare este inevitabilă, nu opțională."},
    switch:{name:"Comutarea metabolică",sh:"Comutarea metabolică",lead:"Glicogenul hepatic scade; grăsimea devine principalul combustibil.",
      mech:["Pe măsură ce glicogenul hepatic se epuizează, starea cu insulină scăzută și glucagon mai ridicat permite accelerarea lipolizei: celulele adipoase scindează trigliceridele în acizi grași liberi și glicerol.",
        "Acizii grași devin principalul combustibil pentru mușchii scheletici, inimă și multe alte țesuturi. Fiecare celulă care arde grăsime în loc de glucoză lasă mai multă glucoză țesuturilor care depind de ea.",
        "Momentul acestei comutări diferă mult: depinde de mărimea ultimei mese, de cât de pline erau depozitele de glicogen, de activitatea fizică, de compoziția corporală și de sănătatea metabolică. Literatura îl descrie ca pe un interval larg (vezi cifrele-cheie)."],
      mean:"Comutarea nu este un ceas, ci un indicator de combustibil. Tot ce golește mai repede glicogenul hepatic (de exemplu activitatea fizică) o aduce mai devreme; tot ce îl reumple o amână. Momentul urmează mecanismul."},
    gng:{name:"Gluconeogeneza",sh:"Gluconeogeneza",lead:"Ficatul construiește glucoză nouă din componente care nu sunt carbohidrați.",
      mech:["Unele celule pot funcționa doar cu glucoză: globulele roșii nu au mitocondrii, iar anumite părți ale rinichiului și creierul au nevoie de glucoză. De aceea aportul de glucoză nu poate scădea niciodată la zero.",
        "Ficatul produce glucoză nouă din trei surse principale: glicerol (scheletul eliberat din grăsimi), lactat (din globulele roșii și din mușchi — ciclul Cori) și aminoacizi, în principal alanină și glutamină din proteinele musculare.",
        "Acizii grași nu pot fi transformați în glucoză în cantități nete — de aceea proteinele ajung să fie o sursă de glucoză."],
      mean:"Cu cât corpul trebuie să producă mai multă glucoză, cu atât are nevoie de mai mulți aminoacizi — o parte provin din proteinele musculare. Aceasta creează problema pe care o rezolvă următoarele două stații."},
    keto:{name:"Cetogeneza",sh:"Cetogeneza",lead:"Ficatul transformă acizii grași într-un combustibil solubil în apă.",
      mech:["Cantități mari de acizi grași ajung la ficat. În mitocondriile hepatice sunt descompuși prin beta-oxidare până la acetil-CoA. Cu insulină scăzută și glucagon ridicat, surplusul de acetil-CoA este transformat în corpi cetonici: acetoacetat și beta-hidroxibutirat (o mică parte din acetoacetat devine acetonă, eliminată prin respirație).",
        "Corpii cetonici se dizolvă în sânge, pătrund ușor în țesuturi și pot fi arși în mitocondrii asemănător acizilor grași. Ficatul însuși nu îi poate folosi — îi lipsește enzima necesară — așa că îi exportă.",
        "Insulina frânează acest proces. La persoanele cu pancreas funcțional rămâne în continuare o cantitate de insulină, care menține nivelul cetonelor într-un interval limitat. În cetoacidoza diabetică insulina lipsește critic, frâna cedează, iar cetonele și glucoza cresc la niveluri periculoase — o stare diferită."],
      mean:"Prin corpii cetonici, ficatul „ambalează” grăsimea pentru țesuturile care nu o pot folosi bine direct. Nivelul lor crește treptat, pe parcursul zilelor, de aceea efectele lor se amplifică în timp, nu apar la o oră anume."},
    brain:{name:"Creierul trece pe cetone",sh:"Creierul trece pe cetone",lead:"Creierul își mută treptat o parte din combustibil de pe glucoză pe cetone.",
      mech:["În starea de hrănire, creierul folosește aproape exclusiv glucoză. Acizii grași liberi abia traversează bariera hemato-encefalică și nu sunt un combustibil cerebral semnificativ.",
        "Corpii cetonici însă o traversează, prin transportori de monocarboxilați (MCT). Cât folosește creierul depinde în mare măsură de nivelul cetonelor din sânge, astfel că utilizarea lor crește odată cu cetonele în zilele de post; și expresia transportorilor poate crește.",
        "În studiul clasic al lui Owen și Cahill, după 5–6 săptămâni de post, beta-hidroxibutiratul și acetoacetatul înlocuiseră glucoza ca principal combustibil al creierului. Beta-hidroxibutiratul din creier crește măsurabil deja după 2–3 zile de post (vezi cifrele-cheie)."],
      mean:"Creierul nu „rămâne fără combustibil” când glicogenul se termină — își schimbă amestecul de combustibil. Schimbarea este treptată, pe parcursul zilelor, ceea ce explică în parte de ce primele zile de post pot fi resimțite altfel decât cele ulterioare."},
    protein:{name:"Economisirea proteinelor",sh:"Economisirea proteinelor",lead:"Creșterea cetonelor reduce nevoia de a descompune proteine.",
      mech:["La începutul postului, o mare parte din glucoza necesară creierului provine din gluconeogeneză, iar o parte importantă din aceasta din aminoacizi — din proteinele corpului, deoarece organismul nu are un depozit dedicat de proteine.",
        "Pe măsură ce creierul își acoperă o parte tot mai mare din necesarul energetic din cetone, are nevoie de mai puțină glucoză. O cerere mai mică de glucoză înseamnă mai puțină gluconeogeneză din aminoacizi, deci descompunerea proteinelor încetinește.",
        "Studiile grupului lui Cahill au arătat că în postul prelungit alanina din sânge — principalul aminoacid glucoformator — scade, ficatul preia mai puțină, iar descompunerea proteinelor este redusă la minimum; la finalul unui post de mai multe săptămâni, doar o mică parte din energie mai provine din aminoacizi (vezi cifrele-cheie). Valorile exacte diferă între persoane și studii."],
      mean:"Cetonele nu sunt doar un combustibil suplimentar; ele permit corpului să-și protejeze proteinele în timpul unui post mai lung. Economisirea proteinelor este o consecință a schimbării de combustibil a creierului — stațiile formează un singur lanț."},
    autophagy:{name:"Autofagia",sh:"Autofagia",lead:"Celulele își reciclează componentele uzate — momentul la om este incert.",
      mech:["Autofagia („autodigestia”) este un proces continuu prin care celula închide proteinele și organitele deteriorate într-o membrană (autofagozom), o fuzionează cu un lizozom și descompune conținutul în elemente reutilizabile.",
        "Este reglată de senzori ai nutrienților. mTOR (activat de nutrienți, aminoacizi și insulină) inhibă autofagia; AMPK (activat când energia celulară este scăzută) o stimulează. Postul scade activitatea mTOR și crește activitatea AMPK, înclinând balanța spre autofagie.",
        "Rezervă importantă: majoritatea datelor despre când și cât de puternic crește postul autofagia provin din studii pe animale și pe culturi celulare. În prezent nu există o metodă consacrată de a măsura direct autofagia la nivelul întregului corp la oameni vii, așa că cronologia la om este incertă. Afirmațiile despre o oră exactă la care autofagia „pornește” nu sunt susținute."],
      mean:"Autofagia are loc tot timpul, la un nivel stabilit de semnale precum mTOR și AMPK. Postul nu apasă un comutator, ci rotește un buton de reglaj — iar la om, cât de mult și cât de repede rămâne o întrebare deschisă."},
    hormones:{name:"Hormoni și electroliți",sh:"Hormoni, electroliți",lead:"Hormonul de creștere și noradrenalina cresc; sarea și apa se redistribuie.",
      mech:["Secreția de hormon de creștere crește în timpul postului. Acesta favorizează lipoliza și ajută la conservarea proteinelor. Noradrenalina (activitatea simpatică) crește și ea în primele zile, susținând mobilizarea grăsimilor și starea de alertă; în studii pe termen scurt, cheltuiala energetică de repaus s-a menținut sau a crescut ușor în primele zile.",
        "Glicogenul este stocat împreună cu apă. Pe măsură ce glicogenul se consumă, această apă este eliberată și eliminată.",
        "Scăderea insulinei influențează și rinichiul: în mod normal insulina favorizează retenția de sodiu, deci cu insulină scăzută se elimină mai mult sodiu — și odată cu el apă (natriureza postului). Corpii cetonici sunt eliminați în urină împreună cu cationi precum sodiul și potasiul. Nivelurile sanguine de potasiu, magneziu și fosfat pot părea normale chiar dacă rezervele totale ale corpului scad."],
      mean:"Scăderea rapidă în greutate din primele zile este în mare parte apă și glicogen, nu grăsime — o consecință directă a legăturii glicogen–apă și a pierderii de sodiu. Aceasta explică și de ce echilibrul de sare și lichide contează mai mult în post decât ne-am aștepta."},
    refeed:{name:"Întreruperea postului / realimentarea",sh:"Realimentarea",lead:"Insulina revine — și trage mineralele în celule.",
      mech:["Când hrana, mai ales carbohidrații, sosește din nou, insulina crește rapid. Corpul revine în modul de stocare: cetogeneza și lipoliza sunt inhibate, celulele preiau glucoză, iar glicogenul se reface.",
        "Utilizarea glucozei și construirea de glicogen și proteine necesită fosfat (pentru ATP și intermediari fosforilați), potasiu și magneziu, iar insulina le direcționează în celule. Tiamina (vitamina B1) se consumă mai repede pe măsură ce metabolismul carbohidraților repornește. Insulina favorizează și retenția de sodiu și apă.",
        "După un aport scăzut sau absent prelungit, rezervele totale ale corpului pentru aceste minerale pot fi epuizate, chiar dacă nivelurile din sânge păreau normale. Deplasarea bruscă în celule poate scădea atunci abrupt fosfatul, potasiul și magneziul din sânge, cu retenție de lichide — acesta este sindromul de realimentare, care poate afecta inima, mușchii și nervii și poate pune viața în pericol."],
      mean:"Riscul nu stă în mâncarea în sine, ci în viteza trecerii dintr-o stare de epuizare înapoi în modul de stocare. Cu cât privarea anterioară a fost mai lungă și mai severă, cu atât această trecere poate fi mai amplă — de aceea realimentarea după un post prelungit este o chestiune medicală."}
  }

  hero:{kicker:"Physiologie des Fastens",h1:"Was dein Körper tut, wenn du aufhörst zu essen",

  st:{
    fed:{name:"Resorptive Phase",sh:"Resorptive Phase",lead:"Glukose strömt ins Blut, Insulin steigt, der Körper speichert.",
      mech:["Kohlenhydrate werden im Darm zu Glukose abgebaut und ins Blut aufgenommen. Der Anstieg des Blutzuckers veranlasst die Betazellen der Bauchspeicheldrüse, Insulin auszuschütten.",
        "Insulin ist das Speichersignal. Es lässt Muskel- und Fettzellen Glukose aufnehmen, bringt Leber und Muskeln dazu, Glykogen aufzubauen, fördert die Fetteinlagerung im Fettgewebe — und hemmt gleichzeitig die Fettfreisetzung (Lipolyse) und die Bildung von Ketonkörpern.",
        "Die Glykogenspeicher sind begrenzt. Sind sie gefüllt, wird überschüssige Energie hauptsächlich als Fett gespeichert — die große, energiedichte Reserve des Körpers."],
      mean:"Solange Insulin hoch ist, ist der Körper im Speichermodus: Hohes Insulin hemmt die Lipolyse und fördert die Speicherung, sodass die Nettofreisetzung gespeicherter Fettsäuren verringert ist. Das kehrt sich um, wenn das Insulin sinkt — die ersten Stunden nach einer Mahlzeit dienen also dem Speichern, nicht dem Verbrennen von Reserven."},
    postabs:{name:"Postresorptive Phase",sh:"Postresorptiv",lead:"Der Darm ist leer; die Leber übernimmt die Glukoseversorgung.",
      mech:["Wenn die Nährstoffaufnahme aus dem Darm endet, sinkt der Blutzucker wieder Richtung Ausgangswert. Insulin fällt, und die Alphazellen der Bauchspeicheldrüse schütten mehr Glukagon aus.",
        "Glukagon wirkt vor allem auf die Leber: Es baut Leberglykogen ab (Glykogenolyse) und gibt Glukose ins Blut ab. Das kann vor allem die Leber (auch die Niere trägt bei), denn diese Organe besitzen das Enzym Glukose-6-Phosphatase, das dem Muskel fehlt. Muskelglykogen bleibt im Muskel und wird dort verbraucht.",
        "Parallel beginnt die Leber, neue Glukose herzustellen (Glukoneogenese), und bei niedrigerem Insulin geben Fettzellen erste Fettsäuren ab."],
      mean:"Der Blutzucker bleibt ohne Nahrung stabil, weil die Leber ihren Speicher leert. Dieser Speicher ist klein, deshalb kann diese Phase nicht beliebig lange dauern — und der nächste Wechsel ist unvermeidlich, nicht optional."},
    switch:{name:"Der metabolische Wechsel",sh:"Metabolischer Wechsel",lead:"Das Leberglykogen geht zur Neige; Fett wird zum Hauptbrennstoff.",
      mech:["Während das Leberglykogen schwindet, erlaubt der Zustand aus niedrigem Insulin und höherem Glukagon eine beschleunigte Lipolyse: Fettzellen spalten Triglyceride in freie Fettsäuren und Glycerin.",
        "Fettsäuren werden zum Hauptbrennstoff für Skelettmuskulatur, Herz und viele andere Gewebe. Jede Zelle, die Fett statt Glukose verbrennt, lässt mehr Glukose für die Gewebe übrig, die darauf angewiesen sind.",
        "Wann dieser Wechsel stattfindet, ist sehr unterschiedlich: Es hängt von der Größe der letzten Mahlzeit ab, davon, wie voll die Glykogenspeicher waren, von körperlicher Aktivität, Körperzusammensetzung und Stoffwechselgesundheit. Die Literatur nennt eine breite Spanne (siehe Kennzahlen)."],
      mean:"Der Wechsel ist keine Uhr, sondern eine Tankanzeige. Alles, was das Leberglykogen schneller leert (z. B. körperliche Aktivität), bringt ihn früher; alles, was es auffüllt, schiebt ihn hinaus. Der Zeitpunkt folgt dem Mechanismus."},
    gng:{name:"Glukoneogenese",sh:"Glukoneogenese",lead:"Die Leber baut neue Glukose aus Bausteinen, die keine Kohlenhydrate sind.",
      mech:["Manche Zellen können nur Glukose verwerten: Rote Blutkörperchen haben keine Mitochondrien, und Teile der Niere sowie das Gehirn brauchen Glukose. Die Glukoseversorgung kann daher nie auf null fallen.",
        "Die Leber bildet neue Glukose aus drei Hauptquellen: Glycerin (dem Gerüst aus dem Fettabbau), Laktat (aus roten Blutkörperchen und Muskeln — der Cori-Zyklus) und Aminosäuren, vor allem Alanin und Glutamin aus Muskelprotein.",
        "Fettsäuren selbst lassen sich nicht netto in Glukose umwandeln — deshalb wird Protein überhaupt zur Glukosequelle."],
      mean:"Je mehr Glukose der Körper herstellen muss, desto mehr Aminosäuren braucht er — ein Teil davon stammt aus Muskelprotein. Damit entsteht das Problem, das die nächsten beiden Stationen lösen."},
    keto:{name:"Ketogenese",sh:"Ketogenese",lead:"Die Leber verwandelt Fettsäuren in einen wasserlöslichen Brennstoff.",
      mech:["Große Mengen Fettsäuren erreichen die Leber. In den Lebermitochondrien werden sie durch Beta-Oxidation zu Acetyl-CoA abgebaut. Bei niedrigem Insulin und hohem Glukagon wird überschüssiges Acetyl-CoA zu Ketonkörpern umgebaut: Acetoacetat und Beta-Hydroxybutyrat (ein kleiner Teil des Acetoacetats wird zu Aceton, das abgeatmet wird).",
        "Ketonkörper lösen sich im Blut, gelangen leicht in die Gewebe und können in den Mitochondrien ähnlich wie Fettsäuren verbrannt werden. Die Leber selbst kann sie nicht nutzen — ihr fehlt das nötige Enzym —, deshalb exportiert sie sie.",
        "Insulin bremst diesen Prozess. Bei normal funktionierender Bauchspeicheldrüse bleibt weiterhin etwas Insulin vorhanden, das die Ketonspiegel in einem begrenzten Bereich hält. Bei der diabetischen Ketoazidose fehlt Insulin kritisch, die Bremse versagt, und Ketone sowie Glukose steigen auf gefährliche Werte — ein anderer Zustand."],
      mean:"Mit Ketonkörpern „verpackt“ die Leber Fett für Gewebe, die Fett direkt nicht gut verwerten können. Ihr Spiegel steigt über Tage allmählich, deshalb wachsen ihre Wirkungen mit der Zeit, statt zu einer festen Stunde einzusetzen."},
    brain:{name:"Das Gehirn nutzt Ketone",sh:"Gehirn nutzt Ketone",lead:"Das Gehirn verlagert einen Teil seines Brennstoffs allmählich von Glukose auf Ketone.",
      mech:["Im gesättigten Zustand läuft das Gehirn fast ausschließlich mit Glukose. Freie Fettsäuren überwinden die Blut-Hirn-Schranke kaum und sind kein nennenswerter Brennstoff für das Gehirn.",
        "Ketonkörper dagegen gelangen hindurch, über Monocarboxylat-Transporter (MCT). Wie viel das Gehirn davon nutzt, hängt weitgehend vom Ketonspiegel im Blut ab; die Ketonnutzung steigt daher mit den Ketonen über die Fastentage, und auch die Transporter können vermehrt gebildet werden.",
        "In der klassischen Studie von Owen und Cahill hatten Beta-Hydroxybutyrat und Acetoacetat nach 5–6 Wochen Fasten die Glukose als wichtigsten Brennstoff des Gehirns abgelöst. Schon nach 2–3 Fastentagen steigt Beta-Hydroxybutyrat im Gehirn messbar an (siehe Kennzahlen)."],
      mean:"Dem Gehirn geht nicht „der Brennstoff aus“, wenn das Glykogen aufgebraucht ist — es ändert seine Brennstoffmischung. Diese Änderung verläuft allmählich über Tage; das ist ein Grund, warum sich die ersten Fastentage anders anfühlen können als spätere."},
    protein:{name:"Proteinschonung",sh:"Proteinschonung",lead:"Steigende Ketone verringern den Bedarf, Protein abzubauen.",
      mech:["Zu Beginn des Fastens stammt ein großer Teil der vom Gehirn benötigten Glukose aus der Glukoneogenese, und ein erheblicher Teil davon aus Aminosäuren — aus Körperprotein, denn der Körper hat keinen eigenen Proteinspeicher.",
        "Je mehr Energie das Gehirn aus Ketonen deckt, desto weniger Glukose braucht es. Weniger Glukosebedarf bedeutet weniger Glukoneogenese aus Aminosäuren, und der Proteinabbau verlangsamt sich.",
        "Studien von Cahills Arbeitsgruppe zeigten, dass beim längeren Fasten das Alanin im Blut — die wichtigste glukogene Aminosäure — sinkt, die Leber weniger davon aufnimmt und der Proteinabbau minimiert wird; am Ende eines mehrwöchigen Fastens stammt nur noch ein kleiner Teil der Energie aus Aminosäuren (siehe Kennzahlen). Genaue Werte unterscheiden sich zwischen Personen und Studien."],
      mean:"Ketone sind nicht nur ein zusätzlicher Brennstoff; sie ermöglichen es dem Körper, beim längeren Fasten sein Protein zu schützen. Proteinschonung ist eine Folge des Brennstoffwechsels im Gehirn — die Stationen bilden eine zusammenhängende Kette."},
    autophagy:{name:"Autophagie",sh:"Autophagie",lead:"Zellen recyceln ihre verbrauchten Bestandteile — der zeitliche Ablauf beim Menschen ist unsicher.",
      mech:["Autophagie („Selbstverdauung“) ist ein fortlaufender Prozess, bei dem die Zelle beschädigte Proteine und Organellen in eine Membran einschließt (Autophagosom), diese mit einem Lysosom verschmilzt und den Inhalt in wiederverwendbare Bausteine zerlegt.",
        "Gesteuert wird sie von Nährstoffsensoren. mTOR (aktiviert durch Nährstoffe, Aminosäuren und Insulin) hemmt die Autophagie; AMPK (aktiviert bei niedriger zellulärer Energie) fördert sie. Fasten senkt die mTOR-Aktivität, erhöht die AMPK-Aktivität und verschiebt so das Gleichgewicht in Richtung Autophagie.",
        "Wichtige Einschränkung: Die meisten Daten dazu, wann und wie stark Fasten die Autophagie steigert, stammen aus Tier- und Zellstudien. Derzeit gibt es keine etablierte Methode, die Autophagie im ganzen Körper beim lebenden Menschen direkt zu messen; der zeitliche Verlauf beim Menschen ist daher unsicher. Aussagen über eine exakte Stunde, zu der die Autophagie „startet“, sind nicht belegt."],
      mean:"Autophagie läuft ständig, auf einem Niveau, das Signale wie mTOR und AMPK einstellen. Fasten dreht an einem Regler, statt einen Schalter umzulegen — und beim Menschen ist offen, wie weit und wie schnell."},
    hormones:{name:"Hormone und Elektrolyte",sh:"Hormone, Elektrolyte",lead:"Wachstumshormon und Noradrenalin steigen; Salz und Wasser verschieben sich.",
      mech:["Die Ausschüttung von Wachstumshormon nimmt beim Fasten zu. Es fördert die Lipolyse und hilft, Protein zu erhalten. Auch Noradrenalin (Sympathikusaktivität) steigt in den ersten Tagen und unterstützt Fettmobilisierung und Wachheit; in Kurzzeitstudien blieb der Ruheenergieumsatz in den ersten Tagen erhalten oder stieg leicht an.",
        "Glykogen wird zusammen mit Wasser gespeichert. Wird Glykogen verbraucht, wird dieses Wasser frei und ausgeschieden.",
        "Sinkendes Insulin wirkt auch auf die Niere: Insulin fördert normalerweise die Natriumrückhaltung, bei niedrigem Insulin wird also mehr Natrium — und mit ihm Wasser — ausgeschieden (die Natriurese des Fastens). Ketonkörper werden zusammen mit Kationen wie Natrium und Kalium über den Urin ausgeschieden. Die Blutwerte von Kalium, Magnesium und Phosphat können normal erscheinen, obwohl die Gesamtspeicher des Körpers sinken."],
      mean:"Der schnelle Gewichtsverlust der ersten Tage besteht großteils aus Wasser und Glykogen, nicht aus Fett — eine direkte Folge der Glykogen-Wasser-Kopplung und des Natriumverlusts. Das erklärt auch, warum Salz- und Flüssigkeitshaushalt beim Fasten mehr zählen, als man erwarten würde."},
    refeed:{name:"Fastenbrechen / Wiederernährung",sh:"Wiederernährung",lead:"Insulin kehrt zurück — und zieht Mineralstoffe in die Zellen.",
      mech:["Kommt wieder Nahrung, besonders Kohlenhydrate, steigt Insulin rasch an. Der Körper schaltet zurück in den Speichermodus: Ketogenese und Lipolyse werden gehemmt, Zellen nehmen Glukose auf, und Glykogen wird wieder aufgebaut.",
        "Glukoseverwertung sowie Glykogen- und Proteinaufbau benötigen Phosphat (für ATP und phosphorylierte Zwischenprodukte), Kalium und Magnesium, und Insulin treibt diese in die Zellen. Thiamin (Vitamin B1) wird schneller verbraucht, sobald der Kohlenhydratstoffwechsel wieder anläuft. Insulin fördert außerdem die Natrium- und Wasserrückhaltung.",
        "Nach längerer geringer oder fehlender Nahrungsaufnahme können die Gesamtspeicher dieser Mineralstoffe erschöpft sein, auch wenn die Blutwerte normal wirkten. Die plötzliche Verschiebung in die Zellen kann dann Phosphat, Kalium und Magnesium im Blut stark absenken, verbunden mit Flüssigkeitsretention — das ist das Refeeding-Syndrom, das Herz, Muskeln und Nerven betreffen und lebensbedrohlich sein kann."],
      mean:"Das Risiko liegt nicht im Essen selbst, sondern in der Geschwindigkeit, mit der ein erschöpfter Zustand zurück in den Speichermodus wechselt. Je länger und ausgeprägter der vorherige Mangel, desto größer kann diese Verschiebung sein — deshalb ist die Wiederernährung nach längerem Fasten eine medizinische Angelegenheit."}
  }
},

  st:{
    fed:{name:"Fed state",sh:"Fed state",lead:"Glucose floods in, insulin rises, the body stores.",
      mech:["Carbohydrates are broken down to glucose in the gut and absorbed into the blood. The rise in blood glucose triggers the beta cells of the pancreas to release insulin.",
        "Insulin is the storage signal. It lets muscle and fat cells take up glucose, tells the liver and muscles to build glycogen, promotes fat storage in adipose tissue — and at the same time suppresses fat release (lipolysis) and ketone production.",
        "Glycogen capacity is limited. Once it is topped up, surplus energy is stored mainly as fat — the body’s large, energy-dense reserve."],
      mean:"While insulin is high, the body is in storage mode: high insulin suppresses lipolysis and promotes storage, so net release of stored fatty acids is reduced. This reverses as insulin comes down — so the first hours after a meal are about storing, not about burning reserves."},
    postabs:{name:"Post-absorptive state",sh:"Post-absorptive",lead:"The gut is empty; the liver takes over the glucose supply.",
      mech:["When absorption ends, blood glucose drifts back towards baseline. Insulin falls and the alpha cells of the pancreas release more glucagon.",
        "Glucagon acts mainly on the liver: it breaks down liver glycogen (glycogenolysis) and releases glucose into the blood. Mainly the liver can do this (the kidney contributes too), because these organs have the enzyme glucose-6-phosphatase, which muscle lacks. Muscle glycogen stays in the muscle and is used there.",
        "In parallel, the liver starts making new glucose (gluconeogenesis), and with lower insulin, fat cells begin releasing some fatty acids."],
      mean:"Blood glucose stays stable without food because the liver is releasing its store. That store is small, which is why this phase cannot last indefinitely — and why the next shift is inevitable, not optional."},
    switch:{name:"The metabolic switch",sh:"Metabolic switch",lead:"Liver glycogen runs low; fat becomes the main fuel.",
      mech:["As liver glycogen runs down, the low-insulin, higher-glucagon state lets lipolysis accelerate: fat cells split triglycerides into free fatty acids and glycerol.",
        "Fatty acids become the main fuel for skeletal muscle, the heart and many other tissues. Every cell that burns fat instead of glucose leaves more glucose for the tissues that depend on it.",
        "When this switch happens differs widely: it depends on the size of the last meal, how full glycogen stores were, physical activity, body composition and metabolic health. The literature gives it as a broad range (see key figures)."],
      mean:"The switch is not a clock; it is a fuel gauge. Anything that empties liver glycogen faster (physical activity, for example) brings it earlier; anything that refills it pushes it later. The timing follows the mechanism."},
    gng:{name:"Gluconeogenesis",sh:"Gluconeogenesis",lead:"The liver builds new glucose from non-carbohydrate parts.",
      mech:["Some cells can only run on glucose: red blood cells have no mitochondria, and parts of the kidney and the brain need glucose. So the glucose supply can never drop to zero.",
        "The liver makes new glucose from three main sources: glycerol (the backbone released from fat), lactate (from red blood cells and muscle — the Cori cycle) and amino acids, mostly alanine and glutamine from muscle protein.",
        "Fatty acids themselves cannot be turned into glucose in net amounts — that is why protein becomes a glucose source at all."],
      mean:"The more glucose the body has to make, the more amino acids it needs — some of which come from muscle protein. This sets up the problem that the next two stations solve."},
    keto:{name:"Ketogenesis",sh:"Ketogenesis",lead:"The liver turns fatty acids into a water-soluble fuel.",
      mech:["Large amounts of fatty acids reach the liver. In liver mitochondria they are broken down by beta-oxidation to acetyl-CoA. With low insulin and high glucagon, the excess acetyl-CoA is converted into ketone bodies: acetoacetate and beta-hydroxybutyrate (a small part of the acetoacetate becomes acetone, which is exhaled).",
        "Ketone bodies dissolve in blood, pass easily into tissues and can be burned in mitochondria much like fatty acids. The liver itself cannot use them — it lacks the enzyme needed — so it exports them.",
        "Insulin brakes this process. With a normally working pancreas some insulin still remains, which keeps ketone levels within a limited range. In diabetic ketoacidosis insulin is critically lacking, the brake fails, and ketones and glucose rise to dangerous levels — a different state."],
      mean:"With ketone bodies the liver “packages” fat for tissues that cannot use fat well directly. Their level rises gradually over days, which is why their effects grow with time rather than appearing at a fixed hour."},
    brain:{name:"The brain on ketones",sh:"Brain on ketones",lead:"The brain gradually shifts part of its fuel from glucose to ketones.",
      mech:["In the fed state the brain runs almost entirely on glucose. Free fatty acids barely cross the blood–brain barrier and are not a significant brain fuel.",
        "Ketone bodies do cross it, through monocarboxylate transporters (MCTs). How much the brain uses depends largely on the blood ketone level, so ketone use rises with ketones over the days of fasting; transporter expression may also increase.",
        "In Owen and Cahill’s classic study, after 5–6 weeks of fasting beta-hydroxybutyrate and acetoacetate had replaced glucose as the brain’s predominant fuel. Brain beta-hydroxybutyrate already rises measurably after 2–3 days of fasting (see key figures)."],
      mean:"The brain does not “run out of fuel” when glycogen is gone — it changes its fuel mix. That change is gradual, over days, which is part of why the first days of a fast can feel different from later ones."},
    protein:{name:"Protein sparing",sh:"Protein sparing",lead:"Rising ketones reduce the need to break down protein.",
      mech:["Early in a fast, much of the glucose the brain needs comes from gluconeogenesis, and a large share of that from amino acids — from body protein, since the body has no dedicated protein store.",
        "As the brain covers more of its energy from ketones, it needs less glucose. Less glucose demand means less gluconeogenesis from amino acids, so protein breakdown slows.",
        "Studies by Cahill’s group showed that in prolonged fasting blood alanine — the main glucose-forming amino acid — falls, the liver takes up less of it, and protein breakdown is minimised; by the end of a multi-week fast only a small share of energy comes from amino acids (see key figures). Exact values differ between individuals and studies."],
      mean:"Ketones are not just an extra fuel; they are what lets the body protect its protein during a longer fast. Protein sparing is a consequence of the brain switching fuel — the stations form one connected chain."},
    autophagy:{name:"Autophagy",sh:"Autophagy",lead:"Cells recycle their own worn-out parts — timing in humans is uncertain.",
      mech:["Autophagy (“self-eating”) is a continuous process in which the cell encloses damaged proteins and organelles in a membrane (autophagosome), fuses it with a lysosome and breaks the contents down into reusable building blocks.",
        "It is regulated by nutrient sensors. mTOR (activated by nutrients, amino acids and insulin) suppresses autophagy; AMPK (activated when cellular energy is low) promotes it. Fasting lowers mTOR activity and raises AMPK activity, tipping the balance towards autophagy.",
        "Important caveat: most data on when and how strongly fasting increases autophagy come from animal and cell studies. There is currently no established way to measure whole-body autophagy directly in living people, so the human timeline is uncertain. Claims of an exact hour when autophagy “starts” are not supported."],
      mean:"Autophagy runs all the time, at a level set by signals such as mTOR and AMPK. Fasting turns a dial rather than flipping a switch — and in humans, how far and how fast is still an open question."},
    hormones:{name:"Hormones and electrolytes",sh:"Hormones, electrolytes",lead:"Growth hormone and noradrenaline rise; salt and water shift.",
      mech:["Growth hormone secretion increases during fasting. It promotes lipolysis and helps conserve protein. Noradrenaline (sympathetic activity) also rises in the first days, supporting fat release and alertness; in short-term studies resting energy expenditure was maintained or slightly increased during the first days.",
        "Glycogen is stored together with water. As glycogen is used up, this water is released and excreted.",
        "Falling insulin also acts on the kidney: insulin normally promotes sodium retention, so with low insulin more sodium — and water with it — is excreted (the natriuresis of fasting). Ketone bodies are excreted in urine together with cations such as sodium and potassium. Blood levels of potassium, magnesium and phosphate can look normal even while total body stores decline."],
      mean:"The rapid weight drop of the first days is largely water and glycogen, not fat — a direct result of the glycogen–water link and sodium loss. It also explains why salt and fluid balance matter more during a fast than one might expect."},
    refeed:{name:"Breaking the fast / refeeding",sh:"Refeeding",lead:"Insulin returns — and pulls minerals into the cells.",
      mech:["When food, especially carbohydrate, arrives again, insulin rises quickly. The body switches back to storage mode: ketogenesis and lipolysis are suppressed, cells take up glucose, and glycogen is rebuilt.",
        "Using glucose and building glycogen and protein require phosphate (for ATP and phosphorylated intermediates), potassium and magnesium, and insulin drives these into cells. Thiamine (vitamin B1) is used up faster as carbohydrate metabolism restarts. Insulin also promotes sodium and water retention.",
        "After prolonged low or no intake, total body stores of these minerals may be depleted even if blood levels looked normal. The sudden shift into cells can then drop blood phosphate, potassium and magnesium sharply, with fluid retention — this is refeeding syndrome, which can affect the heart, muscles and nerves and can be life-threatening."],
      mean:"The risk is not in the food itself but in the speed of the shift from a depleted state back into storage mode. The longer and more severe the preceding deprivation, the larger that shift can be — which is why refeeding after prolonged fasting is a medical matter."}
  }
}
