const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=META.def,pal=META.pals[0],cur=null,t=0;const hidden=new Set();
const X=()=>L[lang];

function fmtV(v){const u=X().u;return v.replace(/(\d)\.(\d)/g,"$1"+X().dec+"$2").replace("{h}",u.h).replace("{d}",u.d).replace("{day}",u.day).replace("{wk}",u.wk)}
/* the label always describes `representative` — the same range as the strong chart bar */
function winLabel(s){const u=X().u;if(s.display==="uncertain")return u.uncertain;if(s.display==="atEnd"||!s.representative)return u.atEnd;const[a,b]=s.representative;
  if(s.display==="from")return a>=48&&a%24===0?"≈ "+a/24+"+ "+u.d:"≈ "+a+"+ "+u.h;return "≈ "+a+"–"+b+" "+u.h}
const repEnd=s=>s.representative[1]==null?META.tMax:s.representative[1];
const continues=s=>(s.representative&&s.representative[1]==null)||s.display==="uncertain";
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const scrollBehavior=()=>reduceMotion()?"auto":"smooth";

/* monotone cubic interpolation (Fritsch–Carlson): smooth, no overshoot */
function mono(pts){const n=pts.length,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),d=[],m=[];
  for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;
    if(s>9){const k=3/Math.sqrt(s);m[i]=k*a*d[i];m[i+1]=k*b*d[i]}}
  return x=>{if(x<=xs[0])return ys[0];if(x>=xs[n-1])return ys[n-1];let i=0;while(x>xs[i+1])i++;
    const h=xs[i+1]-xs[i],s=(x-xs[i])/h,s2=s*s,s3=s2*s;
    return(2*s3-3*s2+1)*ys[i]+(s3-2*s2+s)*h*m[i]+(-2*s3+3*s2)*ys[i+1]+(s3-s2)*h*m[i+1]}}
const FN={};CURVE_KEYS.forEach(k=>FN[k]=mono(CURVES[k]));

const inR=(r,v)=>r&&v>=r[0]&&v<=r[1];
function focusIdx(h){return STATIONS.findIndex(s=>s.focus&&h>=s.focus[0]&&(h<s.focus[1]||(s.focus[1]===META.tMax&&h===META.tMax)))}
function activeSet(h){const out=new Set();STATIONS.forEach((s,i)=>{if(s.representative?(h>=s.representative[0]&&h<=repEnd(s)):(s.display==="uncertain"&&inR(s.onset,h)))out.add(i)});return out}
function level(v){const th=META.levels;let i=0;while(i<th.length&&v>=th[i])i++;return X().lv[i]}

/* ---------- controls ---------- */
function renderControls(){
  $("#langs").innerHTML=META.langs.map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===lang}" lang="${l}">${l.toUpperCase()}</button>`).join("");
  $("#pals").innerHTML=META.pals.map(p=>`<button type="button" data-pal="${p}" aria-pressed="${p===pal}" title="${esc(X().pal.label)}: ${esc(X().pal[p])}"><span class="sw" style="background:linear-gradient(135deg,${p==="ember"?"#f5a524,#e0703a":p==="ketone"?"#2dd4bf,#818cf8":"#f9c77a,#f49ab3"})"></span>${esc(X().pal[p])}</button>`).join("");
}

/* ---------- left sidebar menu (pattern from Respiration's buildMenu) ---------- */
const layoutEl=$("#layout"),menuEl=$("#menu"),menuBtn=$("#menuBtn"),backdrop=$("#backdrop"),collapseBtn=$("#collapseBtn");
let activeKey="";
function buildMenu(){const x=X();
  const item=(key,ico,label,mi,sq)=>`<button type="button" class="menu-item${key===activeKey?" active":""}" data-key="${key}" title="${esc(label)}" style="--mi:${mi}"><span class="mi-ico${sq?" sq":""}" aria-hidden="true">${ico}</span><span class="mi-label">${esc(label)}</span></button>`;
  let h=`<p class="menu-group">${esc(x.nav.map)}</p>`;
  h+=STATIONS.map((s,i)=>item("st-"+i,i+1,x.st[s.id].name,"var(--acc)")).join("");
  h+=`<p class="menu-group">${esc(x.nav.chart)}</p>`+item("chart","∿",x.nav.chart,"var(--ket)",1);
  h+=`<p class="menu-group">${esc(x.nav.videos)}</p>`+item("videos","▶",x.nav.videos,"var(--gcg)",1);
  h+=`<p class="menu-group">${esc(x.nav.sources)}</p>`+item("sources","§",x.nav.sources,"var(--gly)",1);
  $("#nav").innerHTML=h;
}
function markMenu(k){activeKey=k;document.querySelectorAll(".menu-item").forEach(m=>{const on=m.dataset.key===k;m.classList.toggle("active",on);on?m.setAttribute("aria-current","true"):m.removeAttribute("aria-current")})}
const isMobile=()=>matchMedia("(max-width:900px)").matches;
function openMenu(){menuEl.classList.add("open");backdrop.classList.add("show");menuBtn.setAttribute("aria-expanded","true");const f=menuEl.querySelector(".menu-item.active,.menu-item");if(f)f.focus()}
function closeMenu(){const was=menuEl.classList.contains("open");menuEl.classList.remove("open");backdrop.classList.remove("show");menuBtn.setAttribute("aria-expanded","false");if(was&&isMobile())menuBtn.focus()}
let collapsed=store.get("fasting.menuCollapsed")==="1";
function applyCollapsed(){const x=X();layoutEl.classList.toggle("collapsed",collapsed);collapseBtn.setAttribute("aria-expanded",String(!collapsed));
  const lab=collapsed?x.ui.expand:x.ui.collapse;collapseBtn.setAttribute("aria-label",lab);collapseBtn.title=lab}
function goTo(key){
  if(key.startsWith("st-"))openStation(+key.slice(3),true);
  else{document.getElementById(key).scrollIntoView({behavior:scrollBehavior(),block:"start"});markMenu(key)}
  if(isMobile())closeMenu();
}

/* ---------- video library (pattern from Respiration's buildVideos) ---------- */
function buildVideos(){const x=X();
  $("#vidGrid").innerHTML=VIDEOS.map((v,i)=>{
    const t1=(v.t&&v.t[0])||"",t2=(v.t&&v.t[1])||"",ph=x.vid.ph.replace("{n}",i+1),title=(t1+" "+t2).trim()||ph;
    const inner=v.id
      ?`<div class="vid-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0" title="${esc(title)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`
      :`<div class="vid-wrap"><span class="vid-ph">${esc(x.vid.soon)}</span></div>`;
    return `<article class="vid-card">${inner}<p class="vid-title"><span class="vid-line${t1?"":" placeholder"}">${esc(t1||ph)}</span><span class="vid-line">${esc(t2)}&nbsp;</span></p></article>`}).join("");
}

/* ---------- stations ---------- */
function renderStations(){
  $("#stations").innerHTML=STATIONS.map((s,i)=>{const n=X().st[s.id];
    return `<li><button type="button" class="st" id="st-${s.id}" data-i="${i}" aria-expanded="${cur===i}" aria-controls="panel" title="${esc(X().u.varies)}"><span class="st-n mono">${i+1}</span><span class="st-name">${esc(n.name)}</span><span class="st-win mono">${esc(winLabel(s))}</span></button></li>`}).join("");
  markActive();
}
function markActive(){const f=focusIdx(t),a=activeSet(t);
  document.querySelectorAll(".st").forEach(b=>{const i=+b.dataset.i;b.classList.toggle("focus",i===f);b.classList.toggle("on",a.has(i)&&i!==f)});
  document.querySelectorAll("#ganttSvg .gl").forEach(g=>{const i=+g.dataset.i;g.classList.toggle("focus",i===f);g.classList.toggle("on",a.has(i))});
}
function openStation(i,scroll){cur=i;renderPanel();if(cur!=null)markMenu("st-"+cur);document.querySelectorAll(".st").forEach(b=>b.setAttribute("aria-expanded",String(+b.dataset.i===cur)));
  if(scroll&&cur!=null){const p=$("#panel");p.scrollIntoView({behavior:scrollBehavior(),block:"start"});p.focus({preventScroll:true})}}

/* ---------- diagrams (clean schematic: rounded rects, constant strokes, no filters) ---------- */
function fitSize(txt,w){return Math.min(12.5,(w-10)/(txt.length*.56))}
function diagram(id){const D=DIAGRAMS[id],dl=X().dl,C=k=>`var(--${k})`;let sh="",tx="";
  const T=(x,y,str,c,s,an)=>`<text x="${x}" y="${y}" fill="${C(c||"mut")}" font-size="${s||11}" text-anchor="${an||"middle"}" class="dt">${esc(str)}</text>`;
  for(const it of D){
    if(it.n){const w=it.w||96,h=it.h||44,lab=dl[it.n];
      sh+=`<rect x="${it.x}" y="${it.y}" width="${w}" height="${h}" rx="14" fill="var(--ink)" fill-opacity=".06" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1.6"/>`;
      tx+=`<text x="${it.x+w/2}" y="${it.y+(h>60?24:h/2+4.5)}" fill="var(--ink)" font-size="${fitSize(lab,w).toFixed(1)}" text-anchor="middle" class="dn">${esc(lab)}</text>`}
    else if(it.a){const[x1,y1,x2,y2]=it.a,b=it.b||0,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
      const cx=(x1+x2)/2+nx*b,cy=(y1+y2)/2+ny*b,col=C(it.c),w=it.w||2.2;
      const tx_=x2-cx,ty_=y2-cy,tl=Math.hypot(tx_,ty_)||1,ux=tx_/tl,uy=ty_/tl,hs=6+w;
      /* shaft = sub-curve [t0,t1]: the round cap starts exactly at the source edge and ends inside the arrowhead,
         so only the arrowhead tip touches the target edge */
      const t0=(w/2)/len,t1=1-(hs*.5)/len,B=(a,p,q,r)=>(1-a)*(1-a)*p+2*(1-a)*a*q+a*a*r,
        K=(p,q,r)=>(1-t0)*(1-t1)*p+((1-t0)*t1+t0*(1-t1))*q+t0*t1*r,f=v=>v.toFixed(1);
      sh+=`<path d="M${f(B(t0,x1,cx,x2))} ${f(B(t0,y1,cy,y2))} Q${f(K(x1,cx,x2))} ${f(K(y1,cy,y2))} ${f(B(t1,x1,cx,x2))} ${f(B(t1,y1,cy,y2))}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${it.d?' stroke-dasharray="5 5"':""}/>`;
      sh+=`<path d="M${x2} ${y2} L${(x2-ux*hs-uy*hs*.55).toFixed(1)} ${(y2-uy*hs+ux*hs*.55).toFixed(1)} L${(x2-ux*hs+uy*hs*.55).toFixed(1)} ${(y2-uy*hs-ux*hs*.55).toFixed(1)} Z" fill="${col}"/>`;
      if(it.k){const mx=.25*x1+.5*cx+.25*x2,my=.25*y1+.5*cy+.25*y2,lo=it.lo!=null?it.lo:-9,lab=dl[it.k];
        let lx=mx+nx*lo,ly=my+ny*lo,an="middle";if(Math.abs(nx)>.7){an=nx*lo>0?"start":"end"}
        /* lx/ly/la = fixed label position where the gap between boxes is too narrow */
        if(it.lx!=null){lx=it.lx;ly=it.ly;an=it.la||"middle"}
        /* horizontal arrow: shrink the label so it stays inside the gap between the boxes */
        const fs=it.lx==null&&it.lo==null&&!b&&y1===y2?Math.min(10.5,(Math.abs(dx)-6)/(lab.length*.56)):10.5;
        tx+=T(lx.toFixed(1),(ly+3.5).toFixed(1),lab,it.c,fs.toFixed(1),an)}}
    else if(it.t)tx+=T(it.x,it.y,dl[it.t],it.c,it.s,it.an);
    else if(it.raw)tx+=T(it.x,it.y,it.raw,it.c,it.s,it.an);
    else if(it.cell){const[cx,cy,rx,ry]=it.cell;sh+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="var(--ink)" fill-opacity=".04" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.8"/>`}
    else if(it.circ){const[cx,cy,r]=it.circ;sh+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${it.f?C(it.c):"none"}" fill-opacity="${it.f?.3:0}" stroke="${C(it.c)}" stroke-width="1.8"${it.d?' stroke-dasharray="4 4"':""}/>`}
    else if(it.bars){const bx=150,bw=250,share=META.brainKetShare;
      tx+=T(16,118,dl.mix,"ink",11.5,"start");
      tx+=T(16,154,dl.fedBar,"mut",10.5,"start")+T(16,200,dl.weeksBar,"mut",10.5,"start");
      sh+=`<rect x="${bx}" y="140" width="${bw}" height="20" rx="6" fill="var(--glu)" fill-opacity=".85"/>`;
      sh+=`<rect x="${bx}" y="186" width="${bw*(1-share)}" height="20" rx="6" fill="var(--glu)" fill-opacity=".85"/><rect x="${bx+bw*(1-share)}" y="186" width="${bw*share}" height="20" rx="6" fill="var(--ket)" fill-opacity=".85"/>`;
      tx+=`<text x="${bx+8}" y="154" fill="var(--bg)" font-size="10.5" class="dt" style="stroke:none">${esc(dl.glucoseShort)}</text>`;
      tx+=`<text x="${bx+bw*(1-share)+8}" y="200" fill="var(--bg)" font-size="10.5" class="dt" style="stroke:none">${esc(dl.ketShort)}</text>`;
      tx+=T(bx+bw,226,"Owen 1967","mut",9.5,"end")}
  }
  return `<svg viewBox="0 0 420 250" role="img" aria-label="${esc(X().st[id].name)}"><g shape-rendering="geometricPrecision">${sh}</g><g font-family="Fraunces, Georgia, serif" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px;stroke-linejoin:round">${tx}</g></svg>`;
}

/* ---------- panel ---------- */
function renderPanel(){const p=$("#panel");if(cur==null){p.hidden=true;p.innerHTML="";return}
  const s=STATIONS[cur],x=X(),n=x.st[s.id];p.hidden=false;p.setAttribute("aria-labelledby","pTitle");
  p.innerHTML=`<div class="p-head"><span class="p-num mono">${x.ui.station} ${cur+1}/${STATIONS.length}</span><h3 id="pTitle">${esc(n.name)}</h3><span class="chip mono">${esc(winLabel(s))}</span><button type="button" class="x" data-act="close" aria-label="${esc(x.ui.close)}">×</button></div>
  <p class="vary">${esc(x.u.varies)}</p>
  ${s.id==="refeed"?`<p class="rnote">${esc(x.ui.refeedNote)}</p>`:""}
  <p class="lead">${esc(n.lead)}</p>
  <div class="p-grid"><figure class="diag"><div class="scrollx">${diagram(s.id)}</div><figcaption>${esc(x.ui.diagCap)}</figcaption></figure>
  <div><h4>${esc(x.ui.mech)}</h4>${n.mech.map(m=>`<p>${esc(m)}</p>`).join("")}
  <h4>${esc(x.ui.figs)}</h4><dl class="figs">${s.figs.map(f=>{const c=f.context?[f.context.n!=null?"n="+f.context.n:"",x.ctx[f.context.s]||""].filter(Boolean).join(" · "):"";
    return `<div><dt class="mono">${esc(fmtV(f.value))}</dt><dd><span class="ev" title="${esc(x.ui.evidence)}">${esc(x.ev[f.evidence])}</span>${c?`<span class="ctx">${esc(c)}</span>`:""}<br>${esc(x.fig[f.id])}${f.source?` <a href="${SRC[f.source].url}" target="_blank" rel="noopener" title="${esc(SRC[f.source].txt)}">↗ ${esc(srcShort(f.source))}</a>`:""}</dd></div>`}).join("")}</dl></div></div>
  <div class="mean"><h4>${esc(x.ui.mean)}</h4><p>${esc(n.mean)}</p></div>
  <div class="p-nav"><button type="button" class="btn" data-act="prev"${cur===0?" disabled":""}>← ${esc(x.ui.prev)}</button><button type="button" class="btn" data-act="next"${cur===STATIONS.length-1?" disabled":""}>${esc(x.ui.next)} →</button></div>`;
}

/* ---------- chart ---------- */
/* The SVG viewBox is set to the rendered pixel size of #chartBox (re-rendered on resize), so text stays
   legible at any width and the plot starts at the left edge of the panel. Curves and station bars share sx(). */
let zi=ZOOM.length-1,full=false,expanded=false,CH=null;
const win=()=>ZOOM[zi];
function layoutChart(){const W=Math.max(280,Math.round($("#chartBox").clientWidth||760));
  const ph=full?Math.min(560,Math.max(280,Math.round(innerHeight*.5))):Math.min(300,Math.max(210,Math.round(W*.4)));
  const cy0=24,cy1=cy0+ph,gy0=26,row=30;
  CH={W,x0:30,x1:W-18,cy0,cy1,H:cy1+44,gy0,row,GH:gy0+STATIONS.length*row+6}}
const sx=h=>CH.x0+(CH.x1-CH.x0)*h/win(), sy=v=>CH.cy1-(CH.cy1-CH.cy0)*v;
const fmtN=v=>String(+(+v).toFixed(2)).replace(".",X().dec);
const fitFs=(txt,max,avail,cw)=>Math.min(max,avail/(String(txt).length*(cw||.62))).toFixed(1);
/* tick step giving ~5 intervals (~6 ticks); ties keep the smaller step */
function tickStep(w){const c=[.1,.2,.25,.5,1,2,3,4,6,12];return c.reduce((a,b)=>Math.abs(w/b-5)<Math.abs(w/a-5)?b:a)}
const tStep=()=>win()<=4?.05:1;
const snapT=h=>Math.min(win(),Math.max(0,+(Math.round(h/tStep())*tStep()).toFixed(2)));
function curvePath(k){const w=win(),n=240;let d="";for(let i=0;i<=n;i++){const h=w*i/n;d+=(i?"L":"M")+sx(h).toFixed(1)+" "+sy(FN[k](h)).toFixed(1)}return d}
function renderChart(){layoutChart();const x=X(),w=win(),step=tickStep(w),pw=CH.x1-CH.x0,gEnd=CH.gy0+STATIONS.length*CH.row;let s="",g="";
  const ticks=[];for(let i=0;i*step<=w+1e-9;i++)ticks.push(+(i*step).toFixed(2));
  /* --- curve plot (#chartSvg) --- */
  s+=`<defs><clipPath id="plotClip"><rect x="${CH.x0-6}" y="${CH.cy0-10}" width="${pw+12}" height="${CH.cy1-CH.cy0+20}"/></clipPath></defs>`;
  ticks.forEach(h=>s+=`<line class="grid" x1="${sx(h)}" y1="${CH.cy0}" x2="${sx(h)}" y2="${CH.cy1}"/><text x="${sx(h)}" y="${CH.cy1+16}" text-anchor="middle">${fmtN(h)}</text>`);
  [.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${CH.x0}" y1="${sy(v)}" x2="${CH.x1}" y2="${sy(v)}"/>`);
  s+=`<line x1="${CH.x0}" y1="${CH.cy1}" x2="${CH.x1}" y2="${CH.cy1}" stroke="rgba(255,255,255,.3)"/>`;
  const ym=(CH.cy0+CH.cy1)/2;
  s+=`<text x="12" y="${ym}" text-anchor="middle" style="font-size:${fitFs(x.chart.yAxis,11,CH.cy1-CH.cy0-6)}px" transform="rotate(-90 12 ${ym})">${esc(x.chart.yAxis)}</text>`;
  const xt=`${x.chart.xAxis} (${x.u.h})`;
  s+=`<text x="${(CH.x0+CH.x1)/2}" y="${CH.cy1+34}" text-anchor="middle" style="font-size:${fitFs(xt,11,pw)}px">${esc(xt)}</text>`;
  s+=`<text class="wm" x="${CH.x1-6}" y="${CH.cy0+14}" text-anchor="end">${esc(x.chart.wm)}</text>`;
  s+=`<g clip-path="url(#plotClip)">`;
  CURVE_KEYS.forEach(k=>s+=`<path class="cv${hidden.has(k)?" off":""}" data-k="${k}" d="${curvePath(k)}" stroke="var(--${k})"${CURVE_STYLE[k].dash?` stroke-dasharray="${CURVE_STYLE[k].dash}"`:""}/>`);
  /* hand-chosen anchor points of the conceptual model */
  CURVE_KEYS.forEach(k=>CURVES[k].filter(([h])=>h<=w).forEach(([h,v])=>s+=`<circle class="anc${hidden.has(k)?" off":""}" data-k="${k}" cx="${sx(h).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="3.2" fill="var(--bg)" stroke="var(--${k})" stroke-width="1.8"/>`));
  s+=`</g>`;
  s+=`<line id="cur" x1="0" y1="${CH.cy0-6}" x2="0" y2="${CH.cy1+4}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<g id="dots">${CURVE_KEYS.map(k=>`<circle class="dot${hidden.has(k)?" off":""}" data-k="${k}" r="5.5" fill="var(--${k})" stroke="var(--bg)" stroke-width="2"/>`).join("")}</g>`;
  /* --- station window bars (#ganttSvg): same width and x-scale; clipped to the window, ▸ when a bar runs past its end --- */
  ticks.forEach(h=>g+=`<line class="grid" x1="${sx(h)}" y1="${CH.gy0-4}" x2="${sx(h)}" y2="${gEnd}"/>`);
  g+=`<text x="${CH.x0}" y="${CH.gy0-12}" style="font:italic ${fitFs(x.chart.gantt,12,CH.W-CH.x0-4,.5)}px Fraunces,serif;fill:var(--mut)">${esc(x.chart.gantt)}</text>`;
  const clip=r=>r[0]>=w?null:[Math.max(r[0],0),Math.min(r[1],w)];
  STATIONS.forEach((st,i)=>{const y=CH.gy0+i*CH.row,by=y+15;
    g+=`<g data-i="${i}" class="grow" style="cursor:pointer"><rect x="0" y="${y}" width="${CH.W}" height="${CH.row}" fill="transparent"/>`;
    g+=`<text class="gl" data-i="${i}" x="${CH.x0}" y="${y+11}">${i+1}. ${esc(x.st[st.id].sh)}</text>`;
    const on=st.onset&&clip(st.onset),rp=st.representative&&clip([st.representative[0],repEnd(st)]);
    if(on)g+=`<rect x="${sx(on[0])}" y="${by}" width="${Math.max(0,sx(on[1])-sx(on[0]))}" height="11" rx="5.5" fill="var(--acc)" fill-opacity=".2"${st.representative?"":' stroke="var(--acc)" stroke-dasharray="4 3" stroke-opacity=".8"'}/>`;
    if(rp)g+=`<rect x="${sx(rp[0])}" y="${by}" width="${Math.max(0,sx(rp[1])-sx(rp[0]))}" height="11" rx="5.5" fill="var(--acc)" fill-opacity=".75"/>`;
    const past=continues(st)||(st.onset&&st.onset[1]>w)||(st.representative&&repEnd(st)>w);
    if(past)g+=`<path d="M${CH.x1+3} ${by} l7 5.5 l-7 5.5 z" fill="var(--acc)"/>`;
    if(!st.onset)g+=`<text x="${CH.x1}" y="${by+9}" text-anchor="end" style="font-style:italic">→ ${esc(x.u.atEnd)}</text>`;
    g+=`</g>`});
  g+=`<line id="cur2" x1="0" y1="${CH.gy0-4}" x2="0" y2="${gEnd}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const svg=$("#chartSvg");svg.setAttribute("viewBox",`0 0 ${CH.W} ${CH.H}`);svg.innerHTML=s;svg.setAttribute("aria-label",x.chart.aria);
  const gs=$("#ganttSvg");gs.setAttribute("viewBox",`0 0 ${CH.W} ${CH.GH}`);gs.innerHTML=g;gs.setAttribute("aria-label",x.chart.gantt);
}
function renderBarLegend(){const b=X().chart.bars;
  $("#barLegend").innerHTML=`<span><i aria-hidden="true"></i>${esc(b.rep)}</span><span><i class="soft" aria-hidden="true"></i>${esc(b.onset)}</span><span><i class="dash" aria-hidden="true"></i>${esc(b.unc)}</span><span><b aria-hidden="true" style="color:var(--acc)">▸</b>${esc(b.cont)}</span><span><i class="anc" aria-hidden="true"></i>${esc(b.anc)}</span>`}
/* curve toggles: checkbox icon, line sample (colour + dash), name, current level */
function renderLegend(){const x=X();$("#legend").innerHTML=CURVE_KEYS.map(k=>{const on=!hidden.has(k),d=CURVE_STYLE[k].dash;
  return `<button type="button" class="cvt" data-k="${k}" aria-pressed="${on}"><span class="cb" aria-hidden="true">${on?"✓":""}</span> <svg class="smp" viewBox="0 0 30 10" aria-hidden="true"><line x1="1.5" y1="5" x2="28.5" y2="5" stroke="var(--${k})" stroke-width="3" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:""}/></svg> <span class="nm">${esc(x.cv[k])}</span> <span class="lv" data-lv="${k}"></span></button>`}).join("")}
function toggleCurve(b){const k=b.dataset.k;hidden.has(k)?hidden.delete(k):hidden.add(k);const on=!hidden.has(k);
  b.setAttribute("aria-pressed",String(on));b.querySelector(".cb").textContent=on?"✓":"";
  document.querySelectorAll(`#chartSvg [data-k="${k}"]`).forEach(el=>el.classList.toggle("off",!on))}

/* ---------- expand / fullscreen ---------- */
const chartPanel=$("#chartPanel"),expandBtn=$("#expandBtn");
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
function renderExpandBtn(){const x=X();expandBtn.setAttribute("aria-pressed",String(full));
  expandBtn.querySelector(".ico").textContent=full?"⤡":"⤢";expandBtn.querySelector(".lbl").textContent=full?x.chart.shrink:x.chart.expand}
/* state is always read back from the document (fullscreenchange), never assumed */
function syncFull(){full=fsEl()===chartPanel||expanded;
  chartPanel.classList.toggle("is-full",full);document.body.classList.toggle("chart-expanded",full);
  renderExpandBtn();renderChart();update()}
function setExpanded(v){expanded=v;syncFull()}
function toggleFull(){
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(expanded){setExpanded(false);return}
  const req=chartPanel.requestFullscreen||chartPanel.webkitRequestFullscreen;
  if(!req){setExpanded(true);return}   /* e.g. iPhone Safari: fall back to the expanded layout */
  try{const p=req.call(chartPanel);if(p&&typeof p.catch==="function")p.catch(()=>setExpanded(true))}catch(e){setExpanded(true)}}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,syncFull));
["fullscreenerror","webkitfullscreenerror"].forEach(ev=>document.addEventListener(ev,()=>setExpanded(true)));

function update(){const x=X(),w=win();t=Math.min(t,w);const cx=sx(t);
  const z=$("#zoom");z.value=zi;$("#zoomOut").textContent=`0–${fmtN(w)} ${x.u.h}`;
  z.setAttribute("aria-valuetext",(w===1?x.chart.zoomAria.one:x.chart.zoomAria.many).replace("{b}",fmtN(w)));
  const hr=$("#hr");hr.max=w;hr.step=tStep();hr.value=t;$("#hrOut").textContent=`t = ${fmtN(t)} ${x.u.h}`;
  ["#cur","#cur2"].forEach(id=>{const c=$(id);if(c){c.setAttribute("x1",cx);c.setAttribute("x2",cx)}});
  document.querySelectorAll("#dots circle").forEach(d=>{const k=d.dataset.k;d.setAttribute("cx",cx);d.setAttribute("cy",sy(FN[k](t)))});
  document.querySelectorAll("[data-lv]").forEach(e=>e.textContent=level(FN[e.dataset.lv](t)));
  const f=focusIdx(t),a=[...activeSet(t)].filter(i=>i!==f);
  const btn=i=>`<button type="button" class="btn${i===f?" main":""}" data-open="${i}">${i+1}. ${esc(x.st[STATIONS[i].id].name)}</button>`;
  $("#focusBox").innerHTML=`<span class="lbl">${esc(x.chart.focus)}</span>${f>=0?btn(f):esc(x.chart.none)}<span class="lbl">${esc(x.chart.also)}</span>${a.length?a.map(btn).join(""):esc(x.chart.none)}`;
  $("#hr").setAttribute("aria-valuetext",`${fmtN(t)} ${x.u.h} —${f>=0?x.st[STATIONS[f].id].name:""}`);
  markActive();
}

function srcShort(id){const s=SRC[id];if(id==="nice")return "NICE CG32";const y=(s.txt.match(/(19|20)[0-9][0-9]/)||[""])[0];return s.txt.split(/[ ,]/)[0]+(y?" "+y:"")}
function renderSources(){$("#srcList").innerHTML=SOURCES.map(s=>`<li id="src-${s.id}">${esc(s.txt)}${s.url?` <a href="${s.url}" target="_blank" rel="noopener">${esc(s.url.replace(/^https:\/\//,""))}</a>`:""}</li>`).join("")}

function renderAll(){const x=X();document.documentElement.lang=lang;document.title=x.title;
  document.querySelector('meta[name="description"]').setAttribute("content",x.desc);
  document.querySelectorAll("[data-t]").forEach(e=>{const v=get(x,e.dataset.t);if(v!=null)e.textContent=v});
  document.querySelectorAll("[data-ta]").forEach(e=>{const v=get(x,e.dataset.ta);if(v!=null)e.setAttribute("aria-label",v)});
  menuBtn.setAttribute("aria-label",x.ui.menuOpen);
  renderControls();buildMenu();applyCollapsed();renderStations();renderPanel();renderExpandBtn();renderChart();renderBarLegend();renderLegend();renderSources();buildVideos();update();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("button,g.grow");if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;store.set("fasting.lang",lang);renderAll();return}
  if(b.dataset.pal&&b.closest("#pals")){pal=b.dataset.pal;document.documentElement.dataset.pal=pal;store.set("fasting.pal",pal);renderControls();return}
  if(b.classList.contains("st")){const i=+b.dataset.i;openStation(cur===i?null:i,cur!==i);return}
  if(b.classList.contains("grow")){openStation(+b.dataset.i,true);return}
  if(b.dataset.open!=null){openStation(+b.dataset.open,true);return}
  if(b.dataset.act==="close"){const i=cur;openStation(null);const s=document.querySelector(`.st[data-i="${i}"]`);if(s)s.focus();return}
  if(b.dataset.act==="prev"&&cur>0){openStation(cur-1,true);return}
  if(b.dataset.act==="next"&&cur<STATIONS.length-1){openStation(cur+1,true);return}
  if(b.classList.contains("cvt")){toggleCurve(b);return}
  if(b===expandBtn){toggleFull();return}
  if(b.classList.contains("menu-item")){goTo(b.dataset.key);return}
  if(b===menuBtn){openMenu();return}
  if(b===collapseBtn){collapsed=!collapsed;store.set("fasting.menuCollapsed",collapsed?"1":"0");applyCollapsed();return}
});
backdrop.addEventListener("click",closeMenu);
$("#stations").addEventListener("keydown",e=>{const b=e.target.closest(".st");if(!b)return;const i=+b.dataset.i,n=STATIONS.length;let j=null;
  if(e.key==="ArrowRight"||e.key==="ArrowDown")j=(i+1)%n;else if(e.key==="ArrowLeft"||e.key==="ArrowUp")j=(i-1+n)%n;else if(e.key==="Home")j=0;else if(e.key==="End")j=n-1;
  if(j!=null){e.preventDefault();document.querySelector(`.st[data-i="${j}"]`).focus()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&expanded){setExpanded(false);expandBtn.focus();return}
  if(e.key==="Escape"&&menuEl.classList.contains("open")){closeMenu();return}if(e.key==="Escape"&&cur!=null){const i=cur;openStation(null);const s=document.querySelector(`.st[data-i="${i}"]`);if(s)s.focus()}});
$("#hr").addEventListener("input",e=>{t=snapT(+e.target.value);update()});
$("#zoom").addEventListener("input",e=>{zi=+e.target.value;t=snapT(t);renderChart();update()});
$("#chartSvg").addEventListener("pointerdown",e=>{const svg=$("#chartSvg"),r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)*CH.W/r.width,vy=(e.clientY-r.top)*CH.H/r.height;
  if(vx>=CH.x0&&vx<=CH.x1&&vy<CH.cy1+20){t=snapT((vx-CH.x0)/(CH.x1-CH.x0)*win());update()}});
/* re-render at the new pixel width (and height, when expanded) */
let lastW=0;
new ResizeObserver(()=>{const w=Math.round($("#chartBox").clientWidth);if(w&&w!==lastW){lastW=w;renderChart();update()}}).observe($("#chartBox"));
addEventListener("resize",()=>{if(full){renderChart();update()}});

/* ---------- init ---------- */
(function init(){const sl=store.get("fasting.lang"),sp=store.get("fasting.pal");
  CURVE_KEYS.forEach(k=>document.documentElement.style.setProperty("--"+k,CURVE_STYLE[k].color));
  if(sl&&L[sl])lang=sl;if(sp&&META.pals.includes(sp))pal=sp;document.documentElement.dataset.pal=pal;renderAll()})();
</script>
